# Seed server.properties for the dev BDS.
#
# scripts/bds-check.mjs copies this into docker/bds/data/ before the first
# start. The BDS archive is unpacked with `unzip -n`, so it does not overwrite
# this file; the image then applies the environment overrides from
# compose.yaml on top of it.
#
# The three content-log keys are the ones that matter for the check: without
# console output, `console.warn` from packs/behavior/scripts/main.js never
# reaches `docker logs` and "[andrew] script loaded" cannot be observed.

level-name=andrew
server-name=Andrew BDS
gamemode=creative
difficulty=peaceful
allow-cheats=true
# Dev/test stand with cheats already on: every player who joins is an
# operator, so `/give` and friends work without a manual `/op` from the
# console (observed 2026-09-21: operator got "insufficient permissions" on
# a first `/give` until op'd by hand from the console). Not a security
# concern — this server never leaves the LAN.
default-player-permission-level=operator

# LAN-only dev server.
online-mode=false
# Transport. BDS 1.26.51.1 prints "NetherNet is the only supported transport"
# when this is raknet — but the iPad client 1.26.51, joining by address from
# Play → Servers, speaks RakNet (its error screen said "Transport: RakNet:2193",
# 2026-09-21) and a NetherNet-only server has no UDP listener on 19132 at all,
# so that client cannot even ping it. raknet answers the client's protocol;
# the NetherNet ports stay published in compose.yaml in case a client needs them.
transport=raknet
# Gameplay UDP ports NetherNet may bind (must match the range published in
# compose.yaml). bds:up rewrites this key as an external mapping with the
# Mac's LAN IP, so clients are told the host address, not the container's.
server-udp-ports=19160-19169
# Forces the iPad to fetch the resource pack from the server (icons, names)
# instead of joining with it disabled.
texturepack-required=true
server-port=19136
server-portv6=19137
max-players=4

# Script/pack diagnostics — the whole point of running BDS in this project.
content-log-file-enabled=true
content-log-console-output-enabled=true
content-log-level=verbose
