# Seed server.properties for the dev BDS.
#
# scripts/bds-check.mjs copies this into docker/bds/data/ before the first
# start. The BDS archive is unpacked with `unzip -n`, so it does not overwrite
# this file; the image then applies the environment overrides from
# compose.yaml on top of it.
#
# The three content-log keys are the ones that matter for the check: without
# console output, `console.warn` from packs/behavior/scripts/main.js never
# reaches `docker logs` and "[andrew] script loaded" cannot be observed.

level-name=andrew
server-name=Andrew BDS
gamemode=creative
difficulty=peaceful
allow-cheats=true

# LAN-only dev server.
online-mode=false
# BDS 1.26.x accepts players only over NetherNet; without this key the log
# prints TRANSPORT TYPE ERROR and the iPad cannot join (seen on 1.26.51.1).
transport=nethernet
# Forces the iPad to fetch the resource pack from the server (icons, names)
# instead of joining with it disabled.
texturepack-required=true
server-port=19132
server-portv6=19133
max-players=4

# Script/pack diagnostics — the whole point of running BDS in this project.
content-log-file-enabled=true
content-log-console-output-enabled=true
content-log-level=verbose
